[package]
name = "review-queue"
version = "0.1.0"
edition = "2024"
description = "Track reviews across Phabricator, GitHub, and other sources; check them out locally as git worktrees or jj workspaces."
license = "MIT"

[[bin]]
name = "rq"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
directories = "5"
fd-lock = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
comfy-table = "7"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"
insta = "1"
